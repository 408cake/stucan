<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>stucan - 공부시간 차트 가시화</title>
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* 상단 네비게이션 */
        #navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            gap: 15px;
        }
        .left-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #subjectTabs { display: flex; gap: 6px; flex-wrap: wrap; }

        .tab-btn {
            background: #2a2e39;
            color: #9598a1;
            border: 1px solid transparent;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #363a45; color: #fff; }
        .tab-btn.active { background: #2962ff; color: #fff; }

        /* 액션 버튼 공통 */
        .action-btn {
            background: #2a2e39;
            color: #e0e3eb;
            border: 1px solid #363a45;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #363a45; }
        .action-btn.primary { background: #2962ff; border-color: #2962ff; color: #fff; }
        .action-btn.primary:hover { background: #1e4bd8; }
        .action-btn.danger { background: #ef5350; border-color: #ef5350; color: #fff; }
        .action-btn.danger:hover { background: #d32f2f; }

        /* 우측 버튼 그룹 */
        .right-controls { display: flex; align-items: center; gap: 10px; }
        .btn-study-start {
            background: #26a69a;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-study-start:hover { background: #2bbbad; }

        .btn-study-stop {
            background: #78909c;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-study-stop:hover { background: #607d8b; }

        /* 시세 및 학습 정보 바 */
        #info-bar {
            display: flex;
            gap: 20px;
            padding: 10px 20px;
            background: #181b24;
            border-bottom: 1px solid #2a2e39;
            font-size: 13px;
            align-items: center;
            flex-wrap: wrap;
        }
        .info-item span { font-weight: bold; margin-left: 5px; }
        .price-val { color: #26a69a; }
        .target-val { color: #ff9800; }

        /* 상태 뱃지 */
        .status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-studying { background: rgba(38, 166, 154, 0.2); color: #26a69a; border: 1px solid #26a69a; }
        .status-resting { background: rgba(149, 152, 161, 0.2); color: #9598a1; border: 1px solid #9598a1; }

        /* 차트 컨테이너 */
        #chart { width: 100vw; height: calc(100vh - 105px); }

        /* 모달 팝업 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e222d;
            padding: 24px;
            border-radius: 8px;
            width: 360px;
            border: 1px solid #2a2e39;
        }
        .modal-box h3 { margin-top: 0; margin-bottom: 16px; font-size: 16px; color: #fff; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #848e9c; }
        .form-group input {
            width: 100%;
            padding: 8px 10px;
            background: #131722;
            border: 1px solid #2a2e39;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
        }
        .form-group input:focus { outline: none; border-color: #2962ff; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    </style>
</head>
<body>

<!-- 상단 네비게이션: 과목 탭 및 제어 버튼 -->
<div id="navbar">
    <div class="left-controls">
        <div id="subjectTabs"></div>
        <button class="action-btn primary" onclick="openCreateModal()">+ 과목 등록</button>
        <button class="action-btn" onclick="openUpdateModal()">수정</button>
        <button class="action-btn danger" onclick="deleteCurrentSubject()">삭제</button>
    </div>
    <div class="right-controls">
        <button class="btn-study-start" onclick="startStudy()">🔥 공부 시작</button>
        <button class="btn-study-stop" onclick="stopStudy()">☕ 공부 종료</button>
    </div>
</div>

<!-- 과목 지식 가치 및 달성률 정보 바 -->
<div id="info-bar">
    <div class="info-item">선택 과목: <span id="labelName">-</span> (<span id="labelCode">-</span>)</div>
    <div class="info-item">상태: <span id="labelStatus" class="status-badge status-resting">휴식 중</span></div>
    <div class="info-item">초기 가치: <span id="labelInitPrice">-</span>원</div>
    <div class="info-item">현재 가치: <span id="labelCurPrice" class="price-val">-</span>원</div>
    <div class="info-item">목표 가치: <span id="labelTargetPrice" class="target-val">-</span>원</div>
    <div class="info-item">달성률(수익률): <span id="labelProfitRate">-</span></div>
</div>

<!-- 실시간 차트 렌더링 영역 -->
<div id="chart"></div>

<!-- 과목 등록 모달 -->
<div id="createModal" class="modal-overlay">
    <div class="modal-box">
        <h3>새 공부 과목 등록</h3>
        <div class="form-group">
            <label>과목 코드 (영문 식별자: 예: MATH, TOEIC)</label>
            <input type="text" id="createCode" placeholder="CALCULUS">
        </div>
        <div class="form-group">
            <label>과목명</label>
            <input type="text" id="createName" placeholder="미적분학">
        </div>
        <div class="form-group">
            <label>초기 지식 가치 (원)</label>
            <input type="number" id="createInitPrice" placeholder="1000">
        </div>
        <div class="form-group">
            <label>목표 가치 (원)</label>
            <input type="number" id="createTargetPrice" placeholder="600000">
        </div>
        <div class="modal-actions">
            <button class="action-btn" onclick="closeModal('createModal')">취소</button>
            <button class="action-btn primary" onclick="submitCreateSubject()">등록</button>
        </div>
    </div>
</div>

<!-- 과목 수정 모달 -->
<div id="updateModal" class="modal-overlay">
    <div class="modal-box">
        <h3>과목 정보 수정</h3>
        <div class="form-group">
            <label>변경할 과목명</label>
            <input type="text" id="updateName">
        </div>
        <div class="form-group">
            <label>변경할 목표 가치 (원)</label>
            <input type="number" id="updateTargetPrice">
        </div>
        <div class="modal-actions">
            <button class="action-btn" onclick="closeModal('updateModal')">취소</button>
            <button class="action-btn primary" onclick="submitUpdateSubject()">수정 완료</button>
        </div>
    </div>
</div>

<script>
    let subjects = [];              // DB 로드 과목 목록
    let currentSubject = null;      // 현재 활성화된 과목
    const subjectCandles = {};      // 과목 코드별 캔들 배열

    // 1. TradingView 차트 초기화
    const chartContainer = document.getElementById('chart');
    const chart = LightweightCharts.createChart(chartContainer, {
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1f2434' }, horzLines: { color: '#1f2434' } },
        timeScale: { timeVisible: true, secondsVisible: true }
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350'
    });

    window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    });

    // 2. 백엔드에서 과목 목록 로드 (/api/subjects)
    async function loadSubjects(targetCode = null) {
        try {
            const res = await fetch('/api/subjects');
            subjects = await res.json();

            const tabsContainer = document.getElementById('subjectTabs');
            tabsContainer.innerHTML = '';

            if (!subjects || subjects.length === 0) {
                tabsContainer.innerHTML = '<span style="color:#777; font-size:13px; line-height:30px;">등록된 과목이 없습니다.</span>';
                currentSubject = null;
                clearInfoBar();
                candleSeries.setData([]);
                return;
            }

            subjects.forEach(sub => {
                if (!subjectCandles[sub.code]) subjectCandles[sub.code] = [];

                const btn = document.createElement('button');
                btn.className = `tab-btn ${currentSubject && currentSubject.code === sub.code ? 'active' : ''}`;
                btn.textContent = `${sub.name} (${sub.code})`;
                btn.onclick = () => selectSubject(sub.code);
                tabsContainer.appendChild(btn);
            });

            if (targetCode) {
                selectSubject(targetCode);
            } else if (!currentSubject && subjects.length > 0) {
                selectSubject(subjects[0].code);
            } else if (currentSubject) {
                const updated = subjects.find(s => s.code === currentSubject.code);
                if (updated) selectSubject(updated.code);
            }
        } catch (err) {
            console.error('과목 로드 실패:', err);
        }
    }

    // 3. 과목 탭 전환
    function selectSubject(code) {
        const found = subjects.find(s => s.code === code);
        if (!found) return;

        currentSubject = found;

        document.querySelectorAll('#subjectTabs .tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', subjects[idx]?.code === code);
        });

        document.getElementById('labelName').textContent = currentSubject.name;
        document.getElementById('labelCode').textContent = currentSubject.code;
        document.getElementById('labelInitPrice').textContent = Math.round(currentSubject.initialPrice).toLocaleString();
        document.getElementById('labelTargetPrice').textContent = Math.round(currentSubject.targetPrice).toLocaleString();

        const hist = subjectCandles[code] || [];
        candleSeries.setData(hist);

        if (hist.length > 0) {
            const last = hist[hist.length - 1];
            document.getElementById('labelCurPrice').textContent = Math.round(last.close).toLocaleString();
        }
    }

    function clearInfoBar() {
        document.getElementById('labelName').textContent = '-';
        document.getElementById('labelCode').textContent = '-';
        document.getElementById('labelInitPrice').textContent = '-';
        document.getElementById('labelCurPrice').textContent = '-';
        document.getElementById('labelTargetPrice').textContent = '-';
        document.getElementById('labelProfitRate').textContent = '-';
    }

    // 4. SSE 실시간 스트림 연동 (/events)
    const eventSource = new EventSource('/events');

    eventSource.onmessage = (e) => {
        try {
            const msg = JSON.parse(e.data);

            if (msg.type === 'init' && msg.tickers) {
                for (const [code, hist] of Object.entries(msg.tickers)) {
                    subjectCandles[code] = hist;
                }
                if (currentSubject && subjectCandles[currentSubject.code]?.length > 0) {
                    candleSeries.setData(subjectCandles[currentSubject.code]);
                }
            } else if (msg.type === 'update' && msg.tickers) {
                for (const [code, data] of Object.entries(msg.tickers)) {
                    if (!subjectCandles[code]) subjectCandles[code] = [];
                    const list = subjectCandles[code];

                    if (list.length === 0 || list[list.length - 1].time !== data.candle.time) {
                        list.push(data.candle);
                        if (list.length > 100) list.shift();
                    } else {
                        list[list.length - 1] = data.candle;
                    }

                    if (currentSubject && code === currentSubject.code) {
                        candleSeries.update(data.candle);
                        document.getElementById('labelCurPrice').textContent = Math.round(data.price).toLocaleString();

                        const statusEl = document.getElementById('labelStatus');
                        if (data.status === 'STUDYING') {
                            statusEl.textContent = '🔥 공부 중';
                            statusEl.className = 'status-badge status-studying';
                        } else {
                            statusEl.textContent = '☕ 휴식 중';
                            statusEl.className = 'status-badge status-resting';
                        }

                        updateProfitRateUI(data.profitRate);
                    }
                }
            }
        } catch (err) {
            console.error('SSE 수신 오류:', err);
        }
    };

    function updateProfitRateUI(profitRate) {
        const el = document.getElementById('labelProfitRate');
        if (profitRate == null) { el.textContent = '-'; return; }
        const formatted = profitRate.toFixed(2);
        if (profitRate > 0) {
            el.textContent = `+${formatted}%`;
            el.style.color = '#26a69a';
        } else if (profitRate < 0) {
            el.textContent = `${formatted}%`;
            el.style.color = '#ef5350';
        } else {
            el.textContent = `0.00%`;
            el.style.color = '#d1d4dc';
        }
    }

    // 5. 공부 시작 / 종료 API
    async function startStudy() {
        if (!currentSubject) return alert('과목을 먼저 선택해주세요.');
        try {
            await fetch(`/api/subjects/${currentSubject.code}/start`, { method: 'POST' });
        } catch (err) {
            alert('공부 시작 요청 실패');
        }
    }

    async function stopStudy() {
        if (!currentSubject) return alert('과목을 먼저 선택해주세요.');
        try {
            await fetch(`/api/subjects/${currentSubject.code}/stop`, { method: 'POST' });
        } catch (err) {
            alert('공부 종료 요청 실패');
        }
    }

    // 6. 모달 팝업 제어
    function openCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
    function openUpdateModal() {
        if (!currentSubject) return alert('수정할 과목을 먼저 선택해주세요.');
        document.getElementById('updateName').value = currentSubject.name;
        document.getElementById('updateTargetPrice').value = currentSubject.targetPrice;
        document.getElementById('updateModal').style.display = 'flex';
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // 7. 과목 등록 (POST /api/subjects)
    async function submitCreateSubject() {
        const payload = {
            code: document.getElementById('createCode').value.trim().toUpperCase(),
            name: document.getElementById('createName').value.trim(),
            initialPrice: parseFloat(document.getElementById('createInitPrice').value),
            targetPrice: parseFloat(document.getElementById('createTargetPrice').value)
        };

        if (!payload.code || !payload.name || isNaN(payload.initialPrice) || isNaN(payload.targetPrice)) {
            return alert('모든 필드를 올바르게 입력해주세요.');
        }

        const res = await fetch('/api/subjects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('새 과목이 등록되었습니다.');
            closeModal('createModal');
            // 모달 입력창 비우기
            document.getElementById('createCode').value = '';
            document.getElementById('createName').value = '';
            document.getElementById('createInitPrice').value = '';
            document.getElementById('createTargetPrice').value = '';

            // 등록된 새 과목 코드로 목록을 다시 불러오고 자동 선택
            await loadSubjects(payload.code);
        } else {
            const msg = await res.text();
            alert('등록 실패: ' + msg);
        }
    }

    // 8. 과목 수정 (PUT /api/subjects/{code})
    async function submitUpdateSubject() {
        const payload = {
            name: document.getElementById('updateName').value.trim(),
            targetPrice: parseFloat(document.getElementById('updateTargetPrice').value)
        };

        if (!payload.name || isNaN(payload.targetPrice)) {
            return alert('수정할 이름과 목표 가치를 올바르게 입력해주세요.');
        }

        const res = await fetch(`/api/subjects/${currentSubject.code}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('과목 정보가 수정되었습니다.');
            closeModal('updateModal');
            loadSubjects(currentSubject.code);
        } else {
            alert('과목 수정 실패');
        }
    }

    // 9. 과목 삭제 (DELETE /api/subjects/{code})
    async function deleteCurrentSubject() {
        if (!currentSubject) return alert('삭제할 과목을 먼저 선택해주세요.');
        if (!confirm(`정말 "${currentSubject.name} (${currentSubject.code})" 과목을 삭제하시겠습니까?`)) return;

        const res = await fetch(`/api/subjects/${currentSubject.code}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            alert('과목이 삭제되었습니다.');
            delete subjectCandles[currentSubject.code];
            currentSubject = null;
            loadSubjects();
        } else {
            alert('과목 삭제 실패');
        }
    }

    // 초기 실행
    loadSubjects();
</script>
</body>
</html>
